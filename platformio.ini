; SEEDER - sovereign seed generator
;
; Dos placas, un solo árbol de fuentes. La lógica y la criptografía son las
; mismas; lo único que cambia es src/boards/ y el tamaño de la pantalla, que
; la capa de interfaz escala con SX()/SY().
;
; TFT_eSPI y uBitcoin van fijadas en lib/ a propósito: un generador de
; semillas debe compilar igual hoy que dentro de cinco años.

[env]
framework      = arduino
monitor_speed  = 115200
custom_version = 2.2.0           ; unica fuente: scripts/version.py la inyecta
extra_scripts  = pre:scripts/version.py
build_flags =
    -Wall
    -DSEEDER_DEBUG=0              ; nunca a 1 en algo que se flashea de verdad

; --- LilyGO TTGO T-Display · ESP32 · 240x135 · ST7789 por SPI ---
[env:tdisplay]
platform = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17
board     = esp32dev
board_build.flash_mode = dio      ; dio funciona en todo módulo ESP32; qio no
board_build.f_flash    = 80000000L

; --- LilyGO T-Display-S3 · ESP32-S3 · 320x170 · ST7789 paralelo 8 bits ---
[env:tdisplay-s3]
platform = espressif32@6.9.0
board     = lilygo-t-display-s3
build_flags =
    ${env.build_flags}
    -DSEEDER_BOARD_TDISPLAY_S3

; --- Heltec Vision Master T190 · ESP32-S3R8 · 320x170 landscape ST7789 SPI ---
[env:heltec-vision-master-t190]
platform = espressif32@6.9.0
board = heltec-vision-master-t190
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DSEEDER_BOARD_HELTEC_T190
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DTFT_MOSI=48
    -DTFT_MISO=37
    -DTFT_SCLK=38
    -DTFT_CS=39
    -DTFT_DC=47
    -DTFT_RST=40
    -DTFT_BL=17
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
