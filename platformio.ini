; SEEDER - sovereign seed generator
; Board: LilyGO TTGO T-Display (ESP32, 4MB flash, ST7789V 240x135)
;
; TFT_eSPI and uBitcoin are vendored under lib/ and pinned on purpose: a seed
; generator should build byte-for-byte the same today and in five years.
; lib/TFT_eSPI/User_Setup_Select.h is already set to Setup25_TTGO_T_Display.

[env:seeder]
platform  = espressif32@6.9.0     ; Arduino-ESP32 core 2.0.17
board     = esp32dev
framework = arduino

board_build.flash_mode = dio      ; dio works on every ESP32 module; qio is not universal
board_build.f_flash    = 80000000L

monitor_speed = 115200

custom_version = 2.0.0
extra_scripts  = pre:scripts/version.py

build_flags =
    -Wall
    -DSEEDER_DEBUG=0              ; never ship with this at 1: see src/GlobalVARS.h
    -DSEEDER_VERSION=\"2.0.0\"
