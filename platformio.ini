; SEEDER - sovereign seed generator
;
; Tres placas, un solo árbol de fuentes. La lógica y la criptografía son las
; mismas; lo único que cambia es src/boards/ y el tamaño de la pantalla, que
; la capa de interfaz escala con SX()/SY().
;
; TFT_eSPI y uBitcoin van fijadas en lib/ a propósito: un generador de
; semillas debe compilar igual hoy que dentro de cinco años.

[env]
framework      = arduino
monitor_speed  = 115200
custom_version = 2.2.0           ; unica fuente: scripts/version.py la inyecta
extra_scripts  = pre:scripts/version.py
build_flags =
    -Wall
    -DSEEDER_DEBUG=0              ; nunca a 1 en algo que se flashea de verdad

; --- LilyGO TTGO T-Display · ESP32 · 240x135 · ST7789 por SPI ---
[env:tdisplay]
platform = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17
board     = esp32dev
board_build.flash_mode = dio      ; dio funciona en todo módulo ESP32; qio no
board_build.f_flash    = 80000000L

; --- LilyGO T-Display-S3 · ESP32-S3 · 320x170 · ST7789 paralelo 8 bits ---
[env:tdisplay-s3]
platform = espressif32@6.9.0
board     = lilygo-t-display-s3
build_flags =
    ${env.build_flags}
    -DSEEDER_BOARD_TDISPLAY_S3

; --- M5Stack StickS3 (K150) · ESP32-S3 · 240x135 · ST7789P3 SPI ---
; M5GFX handles the panel offsets and M5PM1-controlled display power.
; https://docs.m5stack.com/en/core/StickS3
[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions/sticks3.csv
board_build.arduino.memory_type = qio_opi
lib_ignore = TFT_eSPI
lib_deps =
    m5stack/M5GFX@0.3.0
    https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
build_flags =
    ${env.build_flags}
    -DSEEDER_BOARD_STICKS3
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=0
    -DAPP_LOG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
